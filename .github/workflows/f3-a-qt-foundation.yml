name: F3.A Qt foundation

on:
  push:
    branches:
      - feat/f3-a-qt-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify branch ancestry and clean checkout
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git merge-base HEAD 68488e6c339b8cd60011d51380cb8250c488fb35)" = "68488e6c339b8cd60011d51380cb8250c488fb35"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Install Ubuntu GUI runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb python3-tk libegl1 libgl1 libopengl0 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt development environment explicitly
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-python312.txt -e '.[dev,qt]'

      - name: F3.A focused tests
        run: python -m unittest tests.test_qt_foundation -v

      - name: Baseline regression under Xvfb in a Tk-only process
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a python -m unittest -v \
            tests.test_analysis_plots \
            tests.test_application \
            tests.test_data_state \
            tests.test_export_callbacks \
            tests.test_exports \
            tests.test_gui \
            tests.test_identity \
            tests.test_jobs

      - name: Ruff
        run: |
          python -m ruff check src tests tools
          python -m ruff format --check \
            src/csv_analyzer/state.py \
            src/csv_analyzer/qt_app \
            tests/test_qt_foundation.py

      - name: Build wheel and sdist
        run: |
          python -m build
          sha256sum dist/* | tee dist/SHA256SUMS

      - name: Create external runtime directory
        run: mkdir -p /tmp/varia-f3a-r1-runtime

      - name: Clean base install without Qt extra
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL="$(readlink -f "$(ls dist/*.whl)")"
          python -m venv /tmp/varia-f3a-base
          /tmp/varia-f3a-base/bin/python -m pip install --upgrade pip
          /tmp/varia-f3a-base/bin/pip install \
            -c "$GITHUB_WORKSPACE/constraints-python312.txt" "$WHEEL"
          /tmp/varia-f3a-base/bin/pip check
          /tmp/varia-f3a-base/bin/python - <<'PY' | tee dist/base-environment.txt
          import importlib.util
          import csv_analyzer
          import csv_analyzer.analysis
          import csv_analyzer.data
          import csv_analyzer.exports
          import csv_analyzer.plots
          import csv_analyzer.state
          import csv_analyzer.qt_app
          import csv_analyzer.qt_app.bootstrap

          assert importlib.util.find_spec("PySide6") is None
          print("base_imports=PASS")
          print("pyside6=ABSENT")
          print("package_origin=" + csv_analyzer.__file__)
          PY

      - name: Base CTk entry points and controlled missing-Qt behavior
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/varia-f3a-r1-runtime
          env -u PYTHONPATH /tmp/varia-f3a-base/bin/varia-studio --help
          env -u PYTHONPATH /tmp/varia-f3a-base/bin/csv-analyzer --help
          env -u PYTHONPATH /tmp/varia-f3a-base/bin/varia-studio-qt --help
          env -u PYTHONPATH /tmp/varia-f3a-base/bin/python -m csv_analyzer.qt_app --help

          set +e
          QT_OUTPUT="$(env -u PYTHONPATH /tmp/varia-f3a-base/bin/varia-studio-qt 2>&1)"
          QT_CODE=$?
          MODULE_OUTPUT="$(env -u PYTHONPATH /tmp/varia-f3a-base/bin/python -m csv_analyzer.qt_app 2>&1)"
          MODULE_CODE=$?
          set -e

          test "$QT_CODE" -ne 0
          test "$MODULE_CODE" -ne 0
          printf '%s\n' "$QT_OUTPUT" | tee "$GITHUB_WORKSPACE/dist/base-qt-missing.txt"
          printf '%s\n' "$MODULE_OUTPUT" | tee -a "$GITHUB_WORKSPACE/dist/base-qt-missing.txt"
          printf '%s\n' "$QT_OUTPUT" | grep -F "Install Varia Studio with the 'qt' extra."
          printf '%s\n' "$MODULE_OUTPUT" | grep -F "Install Varia Studio with the 'qt' extra."
          if printf '%s\n%s\n' "$QT_OUTPUT" "$MODULE_OUTPUT" | grep -F "Traceback"; then
            echo "Unexpected traceback from optional Qt entry point" >&2
            exit 1
          fi
          printf 'varia_studio_qt_missing_exit=%s\nmodule_qt_missing_exit=%s\n' \
            "$QT_CODE" "$MODULE_CODE" | tee -a "$GITHUB_WORKSPACE/dist/base-qt-missing.txt"

      - name: Base CTk startup smoke under Xvfb
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set -euxo pipefail
          cd /tmp/varia-f3a-r1-runtime
          env -u PYTHONPATH xvfb-run -a /tmp/varia-f3a-base/bin/python - <<'PY' \
            | tee "$GITHUB_WORKSPACE/dist/base-ctk-smoke.txt"
          from pathlib import Path
          import csv_analyzer
          from csv_analyzer.app import Application

          app = Application()
          app.update_idletasks()
          print("base_ctk_shell=PASS")
          print("cwd=" + str(Path.cwd()))
          print("package_origin=" + str(Path(csv_analyzer.__file__).resolve()))
          app.close()
          PY

      - name: Clean Qt-extra install from the same wheel
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL="$(readlink -f "$(ls dist/*.whl)")"
          python -m venv /tmp/varia-f3a-qt
          /tmp/varia-f3a-qt/bin/python -m pip install --upgrade pip
          /tmp/varia-f3a-qt/bin/pip install \
            -c "$GITHUB_WORKSPACE/constraints-python312.txt" "${WHEEL}[qt]"
          /tmp/varia-f3a-qt/bin/pip check
          /tmp/varia-f3a-qt/bin/python - <<'PY' | tee dist/qt-environment.txt
          import PySide6
          from packaging.version import Version

          version = Version(PySide6.__version__)
          assert Version("6.11.3") <= version < Version("6.13")
          print("pyside6=" + PySide6.__version__)
          print("qt_extra=PASS")
          PY

      - name: External Qt entry points without source tree
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/varia-f3a-r1-runtime
          env -u PYTHONPATH /tmp/varia-f3a-qt/bin/varia-studio-qt --help
          env -u PYTHONPATH /tmp/varia-f3a-qt/bin/python -m csv_analyzer.qt_app --help

      - name: External Qt shell and dataset smoke
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/varia-f3a-r1-runtime
          cat > smoke.csv <<'EOF'
          x,y
          1,2
          3,4
          EOF
          env -u PYTHONPATH QT_QPA_PLATFORM=offscreen \
            /tmp/varia-f3a-qt/bin/python - <<'PY' | tee "$GITHUB_WORKSPACE/dist/qt-smoke.txt"
          from pathlib import Path
          from PySide6.QtCore import QEventLoop, QTimer
          from csv_analyzer.qt_app.bootstrap import create_application
          from csv_analyzer.qt_app.coordinator import Lifecycle

          app, coordinator, shell = create_application()
          coordinator.start()
          shell.show()
          coordinator.load_path(Path("smoke.csv"))

          loop = QEventLoop()
          poll = QTimer()
          poll.setInterval(2)
          def check_loaded():
              if coordinator.state.dataset is not None:
                  loop.quit()
          poll.timeout.connect(check_loaded)
          poll.start()
          QTimer.singleShot(5000, loop.quit)
          loop.exec()
          assert coordinator.state.dataset is not None
          assert coordinator.state.dataset.frame.shape == (2, 2)
          assert coordinator.state.dataset_revision == 1
          assert coordinator.state.selection_revision == 1

          coordinator.begin_close()
          if coordinator.lifecycle is not Lifecycle.CLOSED:
              close_loop = QEventLoop()
              close_poll = QTimer()
              close_poll.setInterval(2)
              close_poll.timeout.connect(
                  lambda: close_loop.quit()
                  if coordinator.lifecycle is Lifecycle.CLOSED
                  else None
              )
              close_poll.start()
              QTimer.singleShot(5000, close_loop.quit)
              close_loop.exec()
          assert coordinator.lifecycle is Lifecycle.CLOSED
          print("qt_shell=PASS")
          print("dataset_shape=2x2")
          print("dataset_revision=1")
          print("selection_revision=1")
          print("lifecycle=CLOSED")
          print("cwd=" + str(Path.cwd()))
          PY

      - name: Record correction environment
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "r1_parent=c7596056f867cc78286bb3a476491bb6e8b23268"
            echo "baseline=68488e6c339b8cd60011d51380cb8250c488fb35"
            echo "python=$(python --version 2>&1)"
            echo "dev_pyside6=$(python -c 'import PySide6; print(PySide6.__version__)')"
            echo "qt_venv_pyside6=$(/tmp/varia-f3a-qt/bin/python -c 'import PySide6; print(PySide6.__version__)')"
            echo "base_pyside6=$(/tmp/varia-f3a-base/bin/python -c 'import importlib.util; print("ABSENT" if importlib.util.find_spec("PySide6") is None else "PRESENT")')"
          } | tee dist/r1-environment.txt

      - uses: actions/upload-artifact@v4
        with:
          name: f3-a-r1-packaging-evidence
          path: |
            dist/*
          if-no-files-found: error
