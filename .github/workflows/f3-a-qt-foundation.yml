name: F3.A Qt foundation

on:
  push:
    branches:
      - feat/f3-a-qt-foundation

permissions:
  contents: read

jobs:
  focal-python:
    name: F3.A focal / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ubuntu Qt runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1

      - name: Install focal development environment
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip install -c constraints-python312.txt -e '.[dev,qt]'
          else
            python -m pip install -e '.[dev,qt]'
          fi

      - name: F3.A focal suite
        run: python -m unittest tests.test_qt_foundation -v

      - name: Record focal environment
        shell: bash
        run: |
          echo "python=$(python --version 2>&1)"
          echo "pyside6=$(python -c 'import PySide6; print(PySide6.__version__)')"

  verify:
    name: F3.A R2 regression / build / installed smokes
    needs: focal-python
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify branch ancestry and clean checkout
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git merge-base HEAD 68488e6c339b8cd60011d51380cb8250c488fb35)" = "68488e6c339b8cd60011d51380cb8250c488fb35"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Install Ubuntu GUI runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb python3-tk libegl1 libgl1 libopengl0 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-python312.txt -e '.[dev,qt]'

      - name: Baseline regression under Xvfb in a Tk-only process
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a python -m unittest -v \
            tests.test_analysis_plots \
            tests.test_application \
            tests.test_data_state \
            tests.test_export_callbacks \
            tests.test_exports \
            tests.test_gui \
            tests.test_identity \
            tests.test_jobs

      - name: Ruff
        run: |
          python -m ruff check src tests tools
          python -m ruff format --check \
            src/csv_analyzer/qt_app \
            tests/test_qt_foundation.py \
            tools/f3a_qt_close_probe.py

      - name: Build wheel and sdist
        run: |
          python -m build
          sha256sum dist/* | tee dist/SHA256SUMS

      - name: Create external runtime directory
        run: mkdir -p /tmp/varia-f3a-r2-runtime

      - name: Clean base install without Qt extra
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL="$(readlink -f "$(ls dist/*.whl)")"
          python -m venv /tmp/varia-f3a-r2-base
          /tmp/varia-f3a-r2-base/bin/python -m pip install --upgrade pip
          /tmp/varia-f3a-r2-base/bin/pip install \
            -c "$GITHUB_WORKSPACE/constraints-python312.txt" "$WHEEL"
          /tmp/varia-f3a-r2-base/bin/pip check
          /tmp/varia-f3a-r2-base/bin/python - <<'PY' | tee dist/base-environment.txt
          import importlib.util
          assert importlib.util.find_spec("PySide6") is None
          print("base_pyside6=ABSENT")
          PY

      - name: Base CTk smoke
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set -euxo pipefail
          cd /tmp/varia-f3a-r2-runtime
          env -u PYTHONPATH /tmp/varia-f3a-r2-base/bin/varia-studio --help
          env -u PYTHONPATH /tmp/varia-f3a-r2-base/bin/csv-analyzer --help
          env -u PYTHONPATH xvfb-run -a /tmp/varia-f3a-r2-base/bin/python - <<'PY' \
            | tee "$GITHUB_WORKSPACE/dist/base-ctk-smoke.txt"
          from csv_analyzer.app import Application
          app = Application()
          app.update_idletasks()
          print("base_ctk_shell=PASS")
          app.close()
          PY

      - name: Clean Qt-extra install from same wheel
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL="$(readlink -f "$(ls dist/*.whl)")"
          python -m venv /tmp/varia-f3a-r2-qt
          /tmp/varia-f3a-r2-qt/bin/python -m pip install --upgrade pip
          /tmp/varia-f3a-r2-qt/bin/pip install \
            -c "$GITHUB_WORKSPACE/constraints-python312.txt" "${WHEEL}[qt]"
          /tmp/varia-f3a-r2-qt/bin/pip check
          /tmp/varia-f3a-r2-qt/bin/python - <<'PY' | tee dist/qt-environment.txt
          import PySide6
          print("pyside6=" + PySide6.__version__)
          PY

      - name: Installed Qt smoke
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/varia-f3a-r2-runtime
          env -u PYTHONPATH /tmp/varia-f3a-r2-qt/bin/varia-studio-qt --help
          env -u PYTHONPATH /tmp/varia-f3a-r2-qt/bin/python -m csv_analyzer.qt_app --help
          cat > smoke.csv <<'EOF'
          x,y
          1,2
          3,4
          EOF
          env -u PYTHONPATH QT_QPA_PLATFORM=offscreen \
            /tmp/varia-f3a-r2-qt/bin/python - <<'PY' | tee "$GITHUB_WORKSPACE/dist/qt-smoke.txt"
          from pathlib import Path
          from PySide6.QtCore import QEventLoop, QTimer
          from csv_analyzer.qt_app.bootstrap import create_application
          from csv_analyzer.qt_app.coordinator import Lifecycle

          app, coordinator, shell = create_application()
          coordinator.start()
          shell.show()
          coordinator.load_path(Path("smoke.csv"))
          loop = QEventLoop()
          poll = QTimer()
          poll.setInterval(2)
          poll.timeout.connect(
              lambda: loop.quit() if coordinator.state.dataset is not None else None
          )
          poll.start()
          QTimer.singleShot(5000, loop.quit)
          loop.exec()
          assert coordinator.state.dataset is not None
          assert coordinator.state.dataset.frame.shape == (2, 2)
          assert coordinator.state.dataset_revision == 1
          assert coordinator.state.selection_revision == 1
          shell.close()
          close_loop = QEventLoop()
          close_poll = QTimer()
          close_poll.setInterval(2)
          close_poll.timeout.connect(
              lambda: close_loop.quit()
              if coordinator.lifecycle is Lifecycle.CLOSED and not shell.isVisible()
              else None
          )
          close_poll.start()
          QTimer.singleShot(5000, close_loop.quit)
          close_loop.exec()
          assert coordinator.lifecycle is Lifecycle.CLOSED
          assert not shell.isVisible()
          print("qt_shell=PASS")
          print("dataset_shape=2x2")
          print("real_shell_close=PASS")
          PY

      - name: Real shell-close probes offscreen
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/varia-f3a-r2-runtime
          : > "$GITHUB_WORKSPACE/dist/close-offscreen.txt"
          for action in quit window; do
            for worker in none cooperative noncancelable; do
              env -u PYTHONPATH QT_QPA_PLATFORM=offscreen \
                timeout 15s /tmp/varia-f3a-r2-qt/bin/python \
                "$GITHUB_WORKSPACE/tools/f3a_qt_close_probe.py" \
                --action "$action" --worker "$worker" \
                | tee -a "$GITHUB_WORKSPACE/dist/close-offscreen.txt"
            done
          done

      - name: Real shell-close probes under Xvfb
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set -euxo pipefail
          cd /tmp/varia-f3a-r2-runtime
          : > "$GITHUB_WORKSPACE/dist/close-xvfb.txt"
          for action in quit window; do
            for worker in none cooperative noncancelable; do
              env -u PYTHONPATH timeout 15s xvfb-run -a \
                /tmp/varia-f3a-r2-qt/bin/python \
                "$GITHUB_WORKSPACE/tools/f3a_qt_close_probe.py" \
                --action "$action" --worker "$worker" \
                | tee -a "$GITHUB_WORKSPACE/dist/close-xvfb.txt"
            done
          done

      - name: Record R2 environment
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "r2_parent=f9bfe85c6718c92b5c41aad3129db3f77b68391e"
            echo "python=$(python --version 2>&1)"
            echo "dev_pyside6=$(python -c 'import PySide6; print(PySide6.__version__)')"
            echo "qt_venv_pyside6=$(/tmp/varia-f3a-r2-qt/bin/python -c 'import PySide6; print(PySide6.__version__)')"
          } | tee dist/r2-environment.txt

      - uses: actions/upload-artifact@v4
        with:
          name: f3-a-r2-evidence
          path: |
            dist/*
          if-no-files-found: error
