[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-analyzer-desktop"
version = "2.0.0"
description = "A desktop workspace for exploring CSV and scientific DAT datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2,<6",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "build>=1.2"]

[project.scripts]
csv-analyzer = "csv_analyzer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
